name: Connector verification

on:
  push:
    branches: [feature/strict-character-exemptions]
  pull_request:
    branches: [exclude-roles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, gmp, intl, mbstring, pdo_sqlite, posix, redis, sqlite3
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        run: composer validate --no-check-publish
      - name: Install dependencies for the reported SeAT versions
        run: composer update --with eveseat/web:5.0.35 --with eveseat/eveapi:5.0.37 --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run focused integration tests
        run: composer test
